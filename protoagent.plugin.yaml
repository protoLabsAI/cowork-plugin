id: cowork
name: Cowork (knowledge-work skill pack)
version: 0.1.1
description: >-
  The skill pack behind protoAgent's Cowork archetype (ADR 0083): original,
  clean-room office-document skills (Word, Excel, PowerPoint, PDF) that produce
  real files via execute_code and the standard Python libraries, plus
  knowledge-work habits — distill recurring work into scheduled tasks,
  consolidate memory, learn the operator's writing voice, and a guided
  /setup-cowork onboarding. Ships skills only: no tools, routes, or surfaces.
  Document skills require execute_code (bundled with the cowork-stack bundle)
  and the pip packages declared below (install via the console's
  install-deps action).
enabled: false
repository: https://github.com/protoLabsAI/cowork-plugin
min_protoagent_version: "0.100.0"

config_section: cowork
config:
  # Where document deliverables are written. Empty = the skills tell the agent
  # to use the operator's fenced project folder (or ask once and remember).
  output_dir: ""

requires_pip:
  - python-docx
  - openpyxl
  - python-pptx
  - pypdf
  - reportlab

capabilities:
  network: []
  filesystem: none
